# ============================================================
# SolarFlow BLE Controller V2.0
#
# Unofficial ESPHome BLE controller for Zendure SolarFlow.
# This project is not affiliated with, sponsored by, or endorsed by Zendure.
#
# V2.0 protocol behavior:
# - No legacy per-device identifier is included in protocol payloads.
# - The initial getAll read uses messageId, timestamp, properties, and method.
# - Writes use method, timestamp, messageId, and the requested property only.
# - Supported writes: inputLimit, outputLimit, acMode, socSet, minSoc,
#   and automatic smartMode=1.
#
# Security / provisioning:
# - ESPHome API encryption key is loaded from secrets.yaml.
# - ESPHome OTA is enabled without a password; optional hardening is documented in README.md.
# - No target Wi-Fi SSID or target Wi-Fi password is compiled into firmware.
# - Wi-Fi is provisioned by the user through the captive portal.
# - The captive-portal setup AP password is loaded from secrets.yaml.
#
# Hardware profile:
# - ESP32-S3 DevKitC-1
# - 16 MB flash
# - ESP-IDF framework
# - WS2812 status LED on GPIO48
# - PSRAM is intentionally not enabled.
#
# BLE behavior:
# - Off / On / Scan modes
# - ZenHA advertisement discovery and device selection
# - Persistent selected BLE MAC address and address type
# - BLESPP handshake, getInfo, getAll
# - Smart Mode readiness gating
# - 60-second keepalive
# - reconnect handling and ~30-second CONNECTING watchdog
# ============================================================

esphome:
  name: bluetooth-solarflow-ble
  friendly_name: SolarFlow BLE Controller

  on_boot:

    - priority: 600
      then:
        - light.turn_on:
            id: status_led
            red: 0%
            green: 0%
            blue: 100%
            brightness: 30%
            effect: none

    - priority: -100
      then:
        - lambda: |-
            if (
              id(solarflow_ble_mode) < 0
              ||
              id(solarflow_ble_mode) > 2
            ) {
              id(solarflow_ble_mode) = 0;
            }

            if (id(solarflow_ble_mode) == 0) {
              id(sf_ble_mode_select).publish_state("Off");
            }
            else if (id(solarflow_ble_mode) == 1) {
              id(sf_ble_mode_select).publish_state("On");
            }
            else {
              id(sf_ble_mode_select).publish_state("Scan");
            }

            id(sf_ble_device_select).publish_state("No selection");

            id(sf_scan_result_1).publish_state("---");
            id(sf_scan_result_2).publish_state("---");
            id(sf_scan_result_3).publish_state("---");
            id(sf_scan_result_4).publish_state("---");
            id(sf_scan_result_5).publish_state("---");

        - script.execute: solarflow_apply_ble_mode

        - lambda: |-
            id(solarflow_led_booting) = false;

        - if:
            condition:
              wifi.connected:

            then:
              - script.execute: solarflow_wifi_connected_led_hold

            else:
              - script.execute: solarflow_update_status_led


esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB

  framework:
    type: esp-idf


logger:
  level: INFO

  logs:
    esp32_ble_client: INFO
    esp32_ble_tracker: INFO
    ble_client: INFO
    ble_text_sensor: WARN
    ble_client.automation: INFO
    light: WARN
    sensor: WARN


api:
  encryption:
    key: !secret api_encryption_key


ota:
  - platform: esphome

# Wi-Fi provisioning
# -----------------
# The target Wi-Fi network is intentionally unknown at build time.
# The user selects the network and enters its password through the captive portal.
# ESPHome stores the user-entered station credentials persistently.
#
wifi:


  reboot_timeout: 0s

  ap:
    ssid: "SolarFlow Wi-Fi Setup"
    password: !secret wifi_setup_password
    ap_timeout: 5s

  on_connect:
    then:
      - script.execute: solarflow_wifi_connected_led_hold

  on_disconnect:
    then:
      - script.stop: solarflow_wifi_connected_led_hold

      - lambda: |-
          id(solarflow_led_wifi_confirm) = false;

      - script.execute: solarflow_update_status_led


captive_portal:


esp32_ble:
  enable_on_boot: false


esp32_ble_tracker:
  scan_parameters:
    active: true
    continuous: false

  on_ble_advertise:
    - then:
        - lambda: |-
            if (id(solarflow_ble_mode) != 2) {
              return;
            }

            const std::string name = x.get_name();

            const bool is_solarflow =
              name.rfind("ZenHA", 0) == 0;

            if (!is_solarflow) {
              return;
            }

            const uint64_t found_mac =
              x.address_uint64();

            if (found_mac == 0) {
              return;
            }

            const int found_addr_type =
              static_cast<int>(
                x.get_address_type()
              );

            const int found_rssi =
              x.get_rssi();

            char mac_buf[18];

            x.address_str_to(mac_buf);

            const std::string mac_text =
              mac_buf;

            int slot = 0;
            bool is_new = false;

            if (id(solarflow_scan_mac_1) == found_mac) {
              slot = 1;
            }
            else if (id(solarflow_scan_mac_2) == found_mac) {
              slot = 2;
            }
            else if (id(solarflow_scan_mac_3) == found_mac) {
              slot = 3;
            }
            else if (id(solarflow_scan_mac_4) == found_mac) {
              slot = 4;
            }
            else if (id(solarflow_scan_mac_5) == found_mac) {
              slot = 5;
            }

            if (slot == 0) {
              if (id(solarflow_scan_mac_1) == 0) {
                slot = 1;
              }
              else if (id(solarflow_scan_mac_2) == 0) {
                slot = 2;
              }
              else if (id(solarflow_scan_mac_3) == 0) {
                slot = 3;
              }
              else if (id(solarflow_scan_mac_4) == 0) {
                slot = 4;
              }
              else if (id(solarflow_scan_mac_5) == 0) {
                slot = 5;
              }
              else {
                return;
              }

              is_new = true;
            }

            if (!is_new) {
              int old_rssi = -127;

              if (slot == 1) {
                old_rssi = id(solarflow_scan_rssi_1);
              }
              else if (slot == 2) {
                old_rssi = id(solarflow_scan_rssi_2);
              }
              else if (slot == 3) {
                old_rssi = id(solarflow_scan_rssi_3);
              }
              else if (slot == 4) {
                old_rssi = id(solarflow_scan_rssi_4);
              }
              else if (slot == 5) {
                old_rssi = id(solarflow_scan_rssi_5);
              }

              if (found_rssi <= old_rssi) {
                return;
              }
            }

            const std::string result =
              name
              + " | "
              + mac_text
              + " | "
              + std::to_string(found_rssi)
              + " dBm";

            if (slot == 1) {
              id(solarflow_scan_mac_1) = found_mac;
              id(solarflow_scan_addr_type_1) = found_addr_type;
              id(solarflow_scan_rssi_1) = found_rssi;
              id(sf_scan_result_1).publish_state(result);
            }
            else if (slot == 2) {
              id(solarflow_scan_mac_2) = found_mac;
              id(solarflow_scan_addr_type_2) = found_addr_type;
              id(solarflow_scan_rssi_2) = found_rssi;
              id(sf_scan_result_2).publish_state(result);
            }
            else if (slot == 3) {
              id(solarflow_scan_mac_3) = found_mac;
              id(solarflow_scan_addr_type_3) = found_addr_type;
              id(solarflow_scan_rssi_3) = found_rssi;
              id(sf_scan_result_3).publish_state(result);
            }
            else if (slot == 4) {
              id(solarflow_scan_mac_4) = found_mac;
              id(solarflow_scan_addr_type_4) = found_addr_type;
              id(solarflow_scan_rssi_4) = found_rssi;
              id(sf_scan_result_4).publish_state(result);
            }
            else if (slot == 5) {
              id(solarflow_scan_mac_5) = found_mac;
              id(solarflow_scan_addr_type_5) = found_addr_type;
              id(solarflow_scan_rssi_5) = found_rssi;
              id(sf_scan_result_5).publish_state(result);
            }

            if (is_new) {
              ESP_LOGI(
                "solarflow_scan",
                "RESULT %d: Name='%s' MAC=%s RSSI=%d dBm",
                slot,
                name.c_str(),
                mac_text.c_str(),
                found_rssi
              );
            }
            
