  - platform: template

    id: sf_ac_mode_text

    name: "SolarFlow AC Direction"

    icon: "mdi:swap-horizontal"

    update_interval: never


  - platform: template

    id: sf_pack_state_text

    name: "SolarFlow Battery Status"

    icon: "mdi:battery-sync"

    update_interval: never


  - platform: ble_client

    ble_client_id: solarflow_ble

    id: solarflow_ble_notify

    name: "SolarFlow BLE Notify"

    internal: true

    service_uuid: "A002"

    characteristic_uuid: "C305"

    notify: true

    update_interval: never


    on_notify:
      then:

        - lambda: |-

            id(solarflow_smartmode_seen_packet) =
              false;


            auto get_int =
              [&](const char *key, int &value) -> bool {

                std::string needle =
                  "\"";

                needle += key;
                needle += "\":";


                size_t pos =
                  x.find(needle);


                if (
                  pos == std::string::npos
                ) {

                  return false;
                }


                pos +=
                  needle.length();


                while (
                  pos < x.length()
                  &&
                  (
                    x[pos] == ' '
                    ||
                    x[pos] == '\t'
                  )
                ) {

                  pos++;
                }


                if (
                  pos >= x.length()
                ) {

                  return false;
                }


                bool negative =
                  false;


                if (
                  x[pos] == '-'
                ) {

                  negative =
                    true;

                  pos++;
                }


                if (
                  pos >= x.length()
                  ||
                  x[pos] < '0'
                  ||
                  x[pos] > '9'
                ) {

                  return false;
                }


                long result =
                  0;


                while (
                  pos < x.length()
                  &&
                  x[pos] >= '0'
                  &&
                  x[pos] <= '9'
                ) {

                  result =
                    result * 10
                    +
                    (x[pos] - '0');

                  pos++;
                }


                if (
                  negative
                ) {

                  result =
                    -result;
                }


                value =
                  (int) result;


                return true;
              };


            int value;

            bool power_changed =
              false;


            if (
              get_int(
                "packInputPower",
                value
              )
            ) {

              id(sf_pack_input_power_raw) =
                value;


              id(sf_output_pack_power).publish_state(
                value
              );

              power_changed =
                true;
            }


            if (
              get_int(
                "outputPackPower",
                value
              )
            ) {

              id(sf_output_pack_power_raw) =
                value;


              id(sf_pack_input_power).publish_state(
                value
              );

              power_changed =
                true;
            }


            if (
              power_changed
            ) {


              const int battery_power =

                id(sf_output_pack_power_raw)
                -
                id(sf_pack_input_power_raw);


              id(sf_battery_power).publish_state(
                battery_power
              );


              ESP_LOGI(
                "solarflow_power",
                "BLE packInput=%dW outputPack=%dW -> Input=%dW Output=%dW -> battery_power=%dW",
                id(sf_pack_input_power_raw),
                id(sf_output_pack_power_raw),
                id(sf_output_pack_power_raw),
                id(sf_pack_input_power_raw),
                battery_power
              );
            }


            if (
              get_int(
                "acMode",
                value
              )
            ) {

              id(cmd_ac_mode) =
                value;

              id(sf_ac_mode_actual).publish_state(
                value
              );

              id(sf_ac_mode_control).publish_state(
                value
              );


              if (
                value == 1
              ) {

                id(sf_ac_mode_text).publish_state(
                  "Charging"
                );
              }

              else if (
                value == 2
              ) {

                id(sf_ac_mode_text).publish_state(
                  "Discharging"
                );
              }

              else {

                id(sf_ac_mode_text).publish_state(
                  "Unknown"
                );
              }
            }


            if (
              get_int(
                "inputLimit",
                value
              )
            ) {

              id(cmd_input_limit) =
                value;

              id(sf_input_limit).publish_state(
                value
              );
            }


            if (
              get_int(
                "outputLimit",
                value
              )
            ) {

              id(cmd_output_limit) =
                value;

              id(sf_output_limit).publish_state(
                value
              );
            }


            if (
              get_int(
                "packState",
                value
              )
            ) {

              id(sf_pack_state).publish_state(
                value
              );


              if (
                value == 0
              ) {

                id(sf_pack_state_text).publish_state(
                  "Standby"
                );
              }

              else if (
                value == 1
              ) {

                id(sf_pack_state_text).publish_state(
                  "Charging"
                );
              }

              else if (
                value == 2
              ) {

                id(sf_pack_state_text).publish_state(
                  "Discharging"
                );
              }

              else {

                id(sf_pack_state_text).publish_state(
                  "Unknown"
                );
              }
            }


            if (
              get_int(
                "acStatus",
                value
              )
            ) {

              id(sf_ac_status).publish_state(
                value
              );
            }


            if (
              get_int(
                "electricLevel",
                value
              )
            ) {

              id(sf_soc).publish_state(
                value
              );
            }


            if (
              get_int(
                "gridState",
                value
              )
            ) {

              id(sf_grid_state).publish_state(
                value
              );
            }


            if (
              get_int(
                "faultLevel",
                value
              )
            ) {

              id(sf_fault_level).publish_state(
                value
              );
            }


            if (
              get_int(
                "smartMode",
                value
              )
            ) {

              id(solarflow_smartmode_seen_packet) =
                true;

              id(solarflow_smart_mode_value) =
                value;

              id(sf_smart_mode).publish_state(
                value
              );


              if (
                value == 1
              ) {

                id(sf_smart_mode_ok).publish_state(
                  true
                );


                if (
                  id(solarflow_protocol_ready)
                  &&
                  id(solarflow_ble_is_connected)
                ) {

                  id(solarflow_ready) =
                    true;

                  id(sf_ble_ready).publish_state(
                    true
                  );
                }


                ESP_LOGI(
                  "solarflow_smartmode",
                  "smartMode=1 -> OK"
                );
              }

              else {

                id(solarflow_ready) =
                  false;

                id(sf_ble_ready).publish_state(
                  false
                );

                id(sf_smart_mode_ok).publish_state(
                  false
                );


                ESP_LOGW(
                  "solarflow_smartmode",
                  "smartMode=%d -> target is 1",
                  value
                );
              }
            }


            if (
              get_int(
                "chargeMaxLimit",
                value
              )
            ) {

              id(sf_charge_max_limit).publish_state(
                value
              );
            }


            if (
              get_int(
                "socLimit",
                value
              )
            ) {

              id(sf_soc_limit).publish_state(
                value
              );

              ESP_LOGI(
                "solarflow_soc",
                "socLimit=%d",
                value
              );
            }


            if (
              get_int(
                "socSet",
                value
              )
            ) {

              id(cmd_max_soc_raw) =
                value;

              const float max_soc =
                ((float) value) / 10.0f;

              id(sf_max_soc).publish_state(
                max_soc
              );

              ESP_LOGI(
                "solarflow_soc",
                "socSet=%d -> Max SOC=%.1f%%",
                value,
                max_soc
              );
            }


            if (
              get_int(
                "minSoc",
                value
              )
            ) {

              id(cmd_min_soc_raw) =
                value;

              const float min_soc =
                ((float) value) / 10.0f;

              id(sf_min_soc).publish_state(
                min_soc
              );

              ESP_LOGI(
                "solarflow_soc",
                "minSoc=%d -> Min SOC=%.1f%%",
                value,
                min_soc
              );
            }


            int ac_mode;


            if (
              get_int(
                "acMode",
                ac_mode
              )
            ) {

              int input_limit =
                -1;

              int output_limit =
                -1;


              get_int(
                "inputLimit",
                input_limit
              );

              get_int(
                "outputLimit",
                output_limit
              );


              ESP_LOGI(
                "solarflow_state",
                "acMode=%d inputLimit=%dW outputLimit=%dW",
                ac_mode,
                input_limit,
                output_limit
              );
            }


            if (
              x.find(
                "\"method\":\"error\""
              )
              !=
              std::string::npos
            ) {

              ESP_LOGW(
                "solarflow_error",
                "%s",
                x.c_str()
              );
            }


        - if:

            condition:

              lambda: |-

                return (
                  id(
                    solarflow_keepalive_waiting_reply
                  )
                  &&
                  x.find(
                    "\"method\":\"getInfo-rsp\""
                  )
                  !=
                  std::string::npos
                );


            then:

              - lambda: |-

                  id(
                    solarflow_keepalive_waiting_reply
                  ) = false;

                  ESP_LOGI(
                    "solarflow_keepalive",
                    "KEEPALIVE OK - getInfo-rsp received"
                  );

                  ESP_LOGI(
                    "solarflow_keepalive",
                    "============================================"
                  );


        - if:

            condition:

              lambda: |-

                if (
                  !id(
                    solarflow_smartmode_seen_packet
                  )
                ) {

                  return false;
                }


                if (
                  !id(
                    solarflow_protocol_ready
                  )
                ) {

                  return false;
                }


                if (
                  !id(
                    solarflow_ble_is_connected
                  )
                ) {

                  return false;
                }


                if (
                  id(
                    solarflow_smart_mode_value
                  )
                  ==
                  1
                ) {

                  return false;
                }


                if (
                  id(
                    solarflow_smartmode_write_pending
                  )
                ) {

                  return false;
                }


                const uint32_t now =
                  millis();


                const uint32_t last =
                  id(
                    solarflow_smartmode_last_write_ms
                  );


                if (
                  last != 0
                  &&
                  (uint32_t) (now - last)
                  <
                  10000
                ) {

                  return false;
                }


                return true;


            then:

              - lambda: |-

                  id(
                    solarflow_smartmode_write_pending
                  ) = true;


                  id(
                    solarflow_smartmode_last_write_ms
                  ) = millis();


                  ESP_LOGW(
                    "solarflow_smartmode",
                    "smartMode is %d -> automatically setting to 1",
                    id(solarflow_smart_mode_value)
                  );


              - delay: 750ms


              - if:

                  condition:

                    lambda: |-

                      return (
                        id(
                          solarflow_protocol_ready
                        )
                        &&
                        id(
                          solarflow_ble_is_connected
                        )
                        &&
                        id(
                          solarflow_smart_mode_value
                        )
                        !=
                        1
                      );


                  then:

                    - ble_client.ble_write:

                        id: solarflow_ble

                        service_uuid: "A002"

                        characteristic_uuid: "C304"

                        value: !lambda |-

                          const uint64_t ts =
                            (uint64_t) millis();

                          const std::string s =
                            std::to_string(ts);


                          const std::string tx =

                            "{\"method\":\"write\","
                            "\"timestamp\":" + s + ","
                            "\"messageId\":\"" + s + "\","
                            "\"properties\":{\"smartMode\":1}}";


                          ESP_LOGI(
                            "solarflow_smartmode",
                            "TX smartMode -> 1"
                          );


                          return std::vector<uint8_t>(
                            tx.begin(),
                            tx.end()
                          );


              - delay: 500ms


              - lambda: |-

                  id(
                    solarflow_smartmode_write_pending
                  ) = false;


        - if:

            condition:

              lambda: |-

                return (
                  !id(
                    solarflow_handshake_done
                  )
                  &&
                  x.find(
                    "\"method\":\"BLESPP\""
                  )
                  !=
                  std::string::npos
                );


            then:

              - lambda: |-

                  ESP_LOGI(
                    "solarflow",
                    "BLESPP detected -> sending BLESPP_OK"
                  );


              - ble_client.ble_write:

                  id: solarflow_ble

                  service_uuid: "A002"

                  characteristic_uuid: "C304"

                  value: !lambda |-

                    const std::string tx =

                      "{\"messageId\":\"1009\","
                      "\"method\":\"BLESPP_OK\"}";


                    return std::vector<uint8_t>(
                      tx.begin(),
                      tx.end()
                    );


              - lambda: |-

                  id(
                    solarflow_handshake_done
                  ) = true;


                  ESP_LOGI(
                    "solarflow",
                    "BLESPP_OK completed"
                  );


              - delay: 500ms


              - if:

                  condition:

                    lambda: |-

                      return (
                        id(
                          solarflow_ble_is_connected
                        )
                        &&
                        !id(
                          solarflow_getinfo_sent
                        )
                      );


                  then:

                    - ble_client.ble_write:

                        id: solarflow_ble

                        service_uuid: "A002"

                        characteristic_uuid: "C304"

                        value: !lambda |-

                          const uint64_t ts =
                            (uint64_t) millis();


                          const std::string s =
                            std::to_string(ts);


                          const std::string tx =

                            "{\"messageId\":\""
                            + s
                            + "\","
                            "\"method\":\"getInfo\","
                            "\"timestamp\":"
                            + s
                            + "}";


                          ESP_LOGI(
                            "solarflow",
                            "Sending initial getInfo"
                          );


                          return std::vector<uint8_t>(
                            tx.begin(),
                            tx.end()
                          );


                    - lambda: |-

                        id(
                          solarflow_getinfo_sent
                        ) = true;


        - if:

            condition:

              lambda: |-

                return (
                  x.find(
                    "\"method\":\"getInfo-rsp\""
                  )
                  !=
                  std::string::npos
                );


            then:

              - lambda: |-

                  id(
                    solarflow_protocol_ready
                  ) = true;


              - if:

                  condition:

                    lambda: |-

                      return (
                        id(
                          solarflow_ble_is_connected
                        )
                        &&
                        !id(
                          solarflow_getall_sent
                        )
                      );


                  then:

                    - lambda: |-

                        ESP_LOGI(
                          "solarflow",
                          "BLESPP protocol ready"
                        );


                    - delay: 300ms


                    - ble_client.ble_write:

                        id: solarflow_ble

                        service_uuid: "A002"

                        characteristic_uuid: "C304"

                        value: !lambda |-

                          const uint64_t ts =
                            (uint64_t) millis();


                          const std::string s =
                            std::to_string(ts);


                          const std::string tx =

                            "{\"messageId\":\"11\","
                            "\"timestamp\":"
                            + s
                            + ","
                            "\"properties\":[\"getAll\"],"
                            "\"method\":\"read\"}";


                          ESP_LOGI(
                            "solarflow",
                            "Sending initial getAll"
                          );


                          return std::vector<uint8_t>(
                            tx.begin(),
                            tx.end()
                          );


                    - lambda: |-

                        id(
                          solarflow_getall_sent
                        ) = true;


                        ESP_LOGI(
                          "solarflow_keepalive",
                          "Initialization complete - first keepalive in 60 s"
                        );


                    - script.execute:
                        id: solarflow_keepalive_loop


interval:

  - interval: 5s

    then:

      - if:

          condition:

            lambda: |-

              static uint8_t connecting_ticks = 0;

              if (
                id(solarflow_mode_change_active)
                ||
                id(solarflow_ble_mode) != 1
                ||
                id(solarflow_selected_mac) == 0
              ) {

                connecting_ticks = 0;
                return false;
              }

              if (
                id(solarflow_ble).state()
                ==
                esphome::esp32_ble_tracker::ClientState::CONNECTING
              ) {

                if (connecting_ticks < 6) {
                  connecting_ticks++;
                }

                if (connecting_ticks >= 6) {

                  connecting_ticks = 0;

                  return true;
                }

                return false;
              }

              connecting_ticks = 0;

              return false;


          then:

            - lambda: |-

                id(solarflow_mode_change_active) = true;

                id(solarflow_ble).set_auto_connect(false);

                id(solarflow_ble_is_connected) = false;

                id(solarflow_handshake_done) = false;
                id(solarflow_getinfo_sent) = false;
                id(solarflow_getall_sent) = false;

                id(solarflow_protocol_ready) = false;
                id(solarflow_ready) = false;

                id(solarflow_smartmode_write_pending) = false;
                id(solarflow_keepalive_waiting_reply) = false;

                id(sf_ble_connected).publish_state(false);
                id(sf_ble_ready).publish_state(false);
                id(sf_smart_mode_ok).publish_state(false);

                ESP_LOGW(
                  "solarflow_reconnect",
                  "CONNECTING for about 30 s -> BLE stack reset"
                );


            - script.execute: solarflow_led_error_hold


            - script.stop: solarflow_keepalive_loop


            - esp32_ble_tracker.stop_scan:


            - if:

                condition:

                  ble.enabled:


                then:

                  - ble.disable:


            - delay: 2s


            - if:

                condition:

                  not:

                    ble.enabled:


                then:

                  - ble.enable:


                  - wait_until:

                      condition:

                        ble.enabled:

                      timeout: 10s


            - wait_until:

                condition:

                  lambda: |-

                    return (
                      id(solarflow_ble).state()
                      ==
                      esphome::esp32_ble_tracker::ClientState::IDLE
                    );

                timeout: 10s


            - if:

                condition:

                  lambda: |-

                    return (
                      id(solarflow_ble_mode) == 1
                      &&
                      id(solarflow_selected_mac) != 0
                      &&
                      id(solarflow_ble).state()
                        ==
                      esphome::esp32_ble_tracker::ClientState::IDLE
                    );


                then:

                  - lambda: |-

                      const uint64_t mac =
                        id(solarflow_selected_mac);

                      const auto addr_type =
                        static_cast<esp_ble_addr_type_t>(
                          id(solarflow_selected_addr_type)
                        );

                      id(solarflow_ble).set_address(mac);

                      id(solarflow_ble).set_remote_addr_type(
                        addr_type
                      );

                      id(solarflow_ble).set_auto_connect(true);

                      id(solarflow_mode_change_active) = false;

                      ESP_LOGW(
                        "solarflow_reconnect",
                        "BLE stack restarted -> reconnecting MAC=%s",
                        id(solarflow_ble).address_str()
                      );


                  - esp32_ble_tracker.start_scan:
                      continuous: true


                else:

                  - lambda: |-

                      if (id(solarflow_ble_mode) == 1) {
                        id(solarflow_mode_change_active) = false;
                      }

                      ESP_LOGE(
                        "solarflow_reconnect",
                        "BLE stack reset completed, but client is not IDLE"
                      );


          else:

            - if:

                condition:

                  lambda: |-

                    return (
                      !id(solarflow_mode_change_active)
                      &&
                      id(solarflow_ble_mode) == 1
                      &&
                      id(solarflow_selected_mac) != 0
                      &&
                      id(solarflow_ble).state()
                        ==
                      esphome::esp32_ble_tracker::ClientState::IDLE
                    );


                then:

                  - if:

                      condition:

                        not:

                          ble.enabled:


                      then:

                        - ble.enable:


                        - wait_until:

                            condition:

                              ble.enabled:

                            timeout: 10s


                  - if:

                      condition:

                        ble.enabled:


                      then:

                        - lambda: |-

                            const uint64_t mac =
                              id(solarflow_selected_mac);

                            const auto addr_type =
                              static_cast<esp_ble_addr_type_t>(
                                id(solarflow_selected_addr_type)
                              );

                            id(solarflow_ble).set_auto_connect(false);

                            id(solarflow_ble).set_address(mac);

                            id(solarflow_ble).set_remote_addr_type(
                              addr_type
                            );

                            id(solarflow_ble).set_auto_connect(true);

                            ESP_LOGW(
                              "solarflow_reconnect",
                              "Client IDLE -> reconnecting MAC=%s",
                              id(solarflow_ble).address_str()
                            );


                        - esp32_ble_tracker.start_scan:
                            continuous: true


script:

  - id: solarflow_update_status_led
    mode: restart
    then:

      - if:
          condition:
            lambda: |-
              return id(solarflow_led_error);

          then:
            - light.turn_on:
                id: status_led
                red: 100%
                green: 0%
                blue: 0%
                brightness: 40%
                effect: "Fast Pulse"

          else:

            - if:
                condition:
                  lambda: |-
                    return id(solarflow_led_booting);

                then:
                  - light.turn_on:
                      id: status_led
                      red: 0%
                      green: 0%
                      blue: 100%
                      brightness: 30%
                      effect: none

                else:

                  - if:
                      condition:
                        not:
                          wifi.connected:

                      then:
                        - light.turn_on:
                            id: status_led
                            red: 100%
                            green: 100%
                            blue: 0%
                            brightness: 30%
                            effect: "Slow Pulse"

                      else:

                        - if:
                            condition:
                              lambda: |-
                                return id(solarflow_led_wifi_confirm);

                            then:
                              - light.turn_on:
                                  id: status_led
                                  red: 0%
                                  green: 100%
                                  blue: 35%
                                  brightness: 30%
                                  effect: none

                            else:

                              - if:
                                  condition:
                                    lambda: |-
                                      return id(solarflow_ble_mode) == 0;

                                  then:
                                    - light.turn_on:
                                        id: status_led
                                        red: 100%
                                        green: 0%
                                        blue: 0%
                                        brightness: 20%
                                        effect: none

                                  else:

                                    - if:
                                        condition:
                                          lambda: |-
                                            return id(solarflow_ble_mode) == 2;

                                        then:
                                          - light.turn_on:
                                              id: status_led
                                              red: 0%
                                              green: 0%
                                              blue: 100%
                                              brightness: 30%
                                              effect: "Slow Pulse"

                                        else:

                                          - if:
                                              condition:
                                                lambda: |-
                                                  return id(solarflow_ready);

                                              then:
                                                - light.turn_on:
                                                    id: status_led
                                                    red: 0%
                                                    green: 100%
                                                    blue: 0%
                                                    brightness: 30%
                                                    effect: none

                                              else:

                                                - light.turn_on:
                                                    id: status_led
                                                    red: 0%
                                                    green: 100%
                                                    blue: 0%
                                                    brightness: 30%
                                                    effect: "Slow Pulse"


  - id: solarflow_wifi_connected_led_hold
    mode: restart
    then:

      - lambda: |-
          id(solarflow_led_wifi_confirm) = true;

      - script.execute: solarflow_update_status_led

      - delay: 5s

      - lambda: |-
          id(solarflow_led_wifi_confirm) = false;

      - script.execute: solarflow_update_status_led


  - id: solarflow_led_error_hold
    mode: restart
    then:

      - lambda: |-
          id(solarflow_led_error) = true;

      - script.execute: solarflow_update_status_led

      - delay: 5s

      - lambda: |-
          id(solarflow_led_error) = false;

      - script.execute: solarflow_update_status_led


  - id: solarflow_apply_ble_mode
    mode: restart
    then:

      - lambda: |-
          id(solarflow_mode_change_active) = true;

          const uint64_t mac =
            id(solarflow_selected_mac);

          if (mac == 0) {
            id(sf_selected_mac_text).publish_state("---");
          }
          else {
            char mac_text[18];

            snprintf(
              mac_text,
              sizeof(mac_text),
              "%02X:%02X:%02X:%02X:%02X:%02X",
              (uint8_t) ((mac >> 40) & 0xFF),
              (uint8_t) ((mac >> 32) & 0xFF),
              (uint8_t) ((mac >> 24) & 0xFF),
              (uint8_t) ((mac >> 16) & 0xFF),
              (uint8_t) ((mac >> 8) & 0xFF),
              (uint8_t) (mac & 0xFF)
            );

            id(sf_selected_mac_text).publish_state(mac_text);
          }

          id(solarflow_ble).set_auto_connect(false);

      - script.stop: solarflow_keepalive_loop

      - esp32_ble_tracker.stop_scan:

      - if:
          condition:
            ble.enabled:

          then:
            - ble_client.disconnect: solarflow_ble


      - if:
          condition:
            lambda: |-
              return id(solarflow_ble_mode) == 0;

          then:
            - lambda: |-
                id(solarflow_ble_is_connected) = false;
                id(solarflow_handshake_done) = false;
                id(solarflow_getinfo_sent) = false;
                id(solarflow_getall_sent) = false;
                id(solarflow_protocol_ready) = false;
                id(solarflow_ready) = false;
                id(solarflow_smartmode_write_pending) = false;
                id(solarflow_keepalive_waiting_reply) = false;

                id(sf_ble_connected).publish_state(false);
                id(sf_ble_ready).publish_state(false);
                id(sf_smart_mode_ok).publish_state(false);

                ESP_LOGI(
                  "solarflow_ble_mode",
                  "OFF -> connection closed, scanner stopped, BLE stack remains active"
                );


            - lambda: |-
                id(solarflow_mode_change_active) = false;


      - if:
          condition:
            lambda: |-
              return id(solarflow_ble_mode) != 0;

          then:
            - if:
                condition:
                  not:
                    ble.enabled:

                then:
                  - ble.enable:

                  - wait_until:
                      condition:
                        ble.enabled:
                      timeout: 10s

            - if:
                condition:
                  ble.enabled:

                then:

                  - if:
                      condition:
                        lambda: |-
                          return id(solarflow_ble_mode) == 2;

                      then:
                        - lambda: |-
                            id(solarflow_scan_mac_1) = 0;
                            id(solarflow_scan_addr_type_1) = 0;
                            id(solarflow_scan_rssi_1) = -127;

                            id(solarflow_scan_mac_2) = 0;
                            id(solarflow_scan_addr_type_2) = 0;
                            id(solarflow_scan_rssi_2) = -127;

                            id(solarflow_scan_mac_3) = 0;
                            id(solarflow_scan_addr_type_3) = 0;
                            id(solarflow_scan_rssi_3) = -127;

                            id(solarflow_scan_mac_4) = 0;
                            id(solarflow_scan_addr_type_4) = 0;
                            id(solarflow_scan_rssi_4) = -127;

                            id(solarflow_scan_mac_5) = 0;
                            id(solarflow_scan_addr_type_5) = 0;
                            id(solarflow_scan_rssi_5) = -127;

                            id(sf_ble_device_select).publish_state(
                              "No selection"
                            );

                            id(sf_scan_result_1).publish_state("---");
                            id(sf_scan_result_2).publish_state("---");
                            id(sf_scan_result_3).publish_state("---");
                            id(sf_scan_result_4).publish_state("---");
                            id(sf_scan_result_5).publish_state("---");

                            ESP_LOGI(
                              "solarflow_ble_mode",
                              "SCAN -> result list cleared, scan starting"
                            );

                        - esp32_ble_tracker.start_scan:
                            continuous: true


                  - if:
                      condition:
                        lambda: |-
                          return id(solarflow_ble_mode) == 1;

                      then:
                        - if:
                            condition:
                              lambda: |-
                                return (
                                  id(solarflow_selected_mac) != 0
                                );

                            then:
                              - lambda: |-
                                  const uint64_t mac =
                                    id(solarflow_selected_mac);

                                  const auto addr_type =
                                    static_cast<esp_ble_addr_type_t>(
                                      id(solarflow_selected_addr_type)
                                    );

                                  id(solarflow_ble).set_address(mac);
                                  id(solarflow_ble).set_remote_addr_type(
                                    addr_type
                                  );
                                  id(solarflow_ble).set_auto_connect(true);

                                  ESP_LOGI(
                                    "solarflow_ble_mode",
                                    "ON -> selected MAC=%s",
                                    id(solarflow_ble).address_str()
                                  );

                              - esp32_ble_tracker.start_scan:
                                  continuous: true

                            else:
                              - lambda: |-
                                  ESP_LOGW(
                                    "solarflow_ble_mode",
                                    "ON -> no MAC selected; not connecting"
                                  );

                else:
                  - lambda: |-
                      ESP_LOGE(
                        "solarflow_ble_mode",
                        "BLE could not be enabled within 10 s"
                      );

                      id(solarflow_led_error_hold).execute();

            - lambda: |-
                id(solarflow_mode_change_active) = false;


  - id: solarflow_keepalive_loop

    mode: restart

    then:

      - while:

          condition:

            lambda: |-

              return (
                id(
                  solarflow_ble_is_connected
                )
                &&
                id(
                  solarflow_handshake_done
                )
                &&
                id(
                  solarflow_protocol_ready
                )
              );


          then:

            - delay: 60s


            - if:

                condition:

                  lambda: |-

                    return (
                      id(
                        solarflow_ble_is_connected
                      )
                      &&
                      id(
                        solarflow_handshake_done
                      )
                      &&
                      id(
                        solarflow_protocol_ready
                      )
                    );


                then:

                  - lambda: |-

                      if (
                        id(
                          solarflow_keepalive_waiting_reply
                        )
                      ) {

                        ESP_LOGW(
                          "solarflow_keepalive",
                          "No getInfo-rsp received for the previous KEEPALIVE"
                        );
                      }


                      id(
                        solarflow_keepalive_waiting_reply
                      ) = true;


                      ESP_LOGI(
                        "solarflow_keepalive",
                        "============================================"
                      );


                      ESP_LOGI(
                        "solarflow_keepalive",
                        "KEEPALIVE START"
                      );


                  - ble_client.ble_write:

                      id: solarflow_ble

                      service_uuid: "A002"

                      characteristic_uuid: "C304"

                      value: !lambda |-

                        const uint64_t ts =
                          (uint64_t) millis();


                        const std::string s =
                          std::to_string(ts);


                        const std::string tx =

                          "{\"messageId\":\""
                          + s
                          + "\","
                          "\"method\":\"getInfo\","
                          "\"timestamp\":"
                          + s
                          + "}";


                        ESP_LOGI(
                          "solarflow_keepalive",
                          "TX getInfo"
                        );


                        return std::vector<uint8_t>(
                          tx.begin(),
                          tx.end()
                        );


switch:

  - platform: template
    id: sf_wifi_reset
    name: "SolarFlow Reset Wi-Fi"
    icon: "mdi:wifi-cog"
    entity_category: config

    optimistic: true
    restore_mode: ALWAYS_OFF

    turn_on_action:

      - logger.log:
          level: WARN
          tag: "solarflow_wifi"
          format: "Wi-Fi is being reset - setup mode will start"

      - lambda: |-
          wifi::global_wifi_component->save_wifi_sta(
            "__SOLARFLOW_WIFI_SETUP__",
            ""
          );

      - delay: 1s

      - button.press: sf_restart_button


button:

  - platform: restart
    id: sf_restart_button
    name: "Restart SolarFlow Controller"


light:

  - platform: esp32_rmt_led_strip

    id: status_led

    name: "SolarFlow Status LED"

    chipset: WS2812

    pin: GPIO48

    num_leds: 1

    channel_colors: GRB

    restore_mode: ALWAYS_OFF

    effects:

      - pulse:
          name: "Slow Pulse"
          transition_length: 500ms
          update_interval: 1500ms
          min_brightness: 5%
          max_brightness: 30%

      - pulse:
          name: "Fast Pulse"
          transition_length: 150ms
          update_interval: 300ms
          min_brightness: 0%
          max_brightness: 40%
