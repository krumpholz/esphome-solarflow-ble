select:

  - platform: template
    id: sf_ble_mode_select
    name: "SolarFlow Bluetooth Mode"
    icon: "mdi:bluetooth-settings"
    options:
      - "Off"
      - "On"
      - "Scan"
    initial_option: "Off"
    optimistic: false
    restore_value: false

    set_action:
      - lambda: |-
          if (x == "Off") {
            id(solarflow_ble_mode) = 0;
          }
          else if (x == "On") {
            id(solarflow_ble_mode) = 1;
          }
          else if (x == "Scan") {
            id(solarflow_ble_mode) = 2;
          }
          else {
            ESP_LOGW(
              "solarflow_ble_mode",
              "Unknown Bluetooth mode: %s",
              x.c_str()
            );
            return;
          }

          id(sf_ble_mode_select).publish_state(x);

          ESP_LOGI(
            "solarflow_ble_mode",
            "Bluetooth mode -> %s",
            x.c_str()
          );

      - script.stop: solarflow_led_error_hold

      - lambda: |-
          id(solarflow_led_error) = false;

      - script.execute: solarflow_apply_ble_mode

      - script.execute: solarflow_update_status_led


  - platform: template
    id: sf_ble_device_select
    name: "SolarFlow BLE Scan Selection"
    icon: "mdi:bluetooth-connect"
    options:
      - "No selection"
      - "Result 1"
      - "Result 2"
      - "Result 3"
      - "Result 4"
      - "Result 5"
    initial_option: "No selection"
    optimistic: false
    restore_value: false

    set_action:
      - lambda: |-
          id(solarflow_device_selection_valid) = false;

          if (x == "No selection") {
            id(sf_ble_device_select).publish_state(x);
            return;
          }

          uint64_t mac = 0;
          int addr_type = 0;

          if (x == "Result 1") {
            mac = id(solarflow_scan_mac_1);
            addr_type = id(solarflow_scan_addr_type_1);
          }
          else if (x == "Result 2") {
            mac = id(solarflow_scan_mac_2);
            addr_type = id(solarflow_scan_addr_type_2);
          }
          else if (x == "Result 3") {
            mac = id(solarflow_scan_mac_3);
            addr_type = id(solarflow_scan_addr_type_3);
          }
          else if (x == "Result 4") {
            mac = id(solarflow_scan_mac_4);
            addr_type = id(solarflow_scan_addr_type_4);
          }
          else if (x == "Result 5") {
            mac = id(solarflow_scan_mac_5);
            addr_type = id(solarflow_scan_addr_type_5);
          }

          if (mac == 0) {
            ESP_LOGW(
              "solarflow_select",
              "%s is empty - selection ignored",
              x.c_str()
            );
            return;
          }

          id(solarflow_selected_mac) = mac;
          id(solarflow_selected_addr_type) = addr_type;

          char mac_text[18];

          snprintf(
            mac_text,
            sizeof(mac_text),
            "%02X:%02X:%02X:%02X:%02X:%02X",
            (uint8_t) ((mac >> 40) & 0xFF),
            (uint8_t) ((mac >> 32) & 0xFF),
            (uint8_t) ((mac >> 24) & 0xFF),
            (uint8_t) ((mac >> 16) & 0xFF),
            (uint8_t) ((mac >> 8) & 0xFF),
            (uint8_t) (mac & 0xFF)
          );

          id(sf_selected_mac_text).publish_state(mac_text);
          id(sf_ble_device_select).publish_state(x);

          id(solarflow_ble_mode) = 1;
          id(sf_ble_mode_select).publish_state("On");

          id(solarflow_device_selection_valid) = true;

          ESP_LOGI(
            "solarflow_select",
            "%s selected -> MAC=%s",
            x.c_str(),
            mac_text
          );

      - if:
          condition:
            lambda: |-
              return id(solarflow_device_selection_valid);

          then:
            - script.stop: solarflow_led_error_hold

            - lambda: |-
                id(solarflow_led_error) = false;

            - script.execute: solarflow_apply_ble_mode

            - script.execute: solarflow_update_status_led


binary_sensor:

  - platform: template
    id: sf_ble_connected
    name: "SolarFlow BLE Connected"
    icon: "mdi:bluetooth-connect"


  - platform: template
    id: sf_ble_ready
    name: "SolarFlow BLE Control Ready"
    icon: "mdi:check-network"

    on_press:
      then:
        - script.execute: solarflow_update_status_led

    on_release:
      then:
        - script.execute: solarflow_update_status_led


  - platform: template
    id: sf_smart_mode_ok
    name: "SolarFlow Smart Mode OK"
    icon: "mdi:check-circle-outline"


ble_client:

  - mac_address: "00:00:00:00:00:01"

    id: solarflow_ble

    auto_connect: false


    on_connect:
      then:

        - if:
            condition:
              lambda: |-
                return (
                  id(solarflow_ble_mode) == 1
                  &&
                  !id(solarflow_mode_change_active)
                  &&
                  id(solarflow_selected_mac) != 0
                  &&
                  id(solarflow_ble).get_address()
                    == id(solarflow_selected_mac)
                );

            then:
              - lambda: |-
                  id(solarflow_ble_is_connected) = true;

                  id(solarflow_handshake_done) = false;
                  id(solarflow_getinfo_sent) = false;
                  id(solarflow_getall_sent) = false;

                  id(solarflow_protocol_ready) = false;
                  id(solarflow_ready) = false;

                  id(solarflow_smart_mode_value) = -1;
                  id(solarflow_smartmode_seen_packet) = false;
                  id(solarflow_smartmode_write_pending) = false;
                  id(solarflow_smartmode_last_write_ms) = 0;

                  id(solarflow_keepalive_waiting_reply) = false;

                  id(sf_ble_connected).publish_state(true);
                  id(sf_ble_ready).publish_state(false);
                  id(sf_smart_mode_ok).publish_state(false);

                  ESP_LOGI(
                    "solarflow",
                    "============================================"
                  );

                  ESP_LOGI(
                    "solarflow",
                    "BLE CONNECTED"
                  );

                  ESP_LOGI(
                    "solarflow",
                    "MAC=%s",
                    id(solarflow_ble).address_str()
                  );

                  ESP_LOGI(
                    "solarflow",
                    "Waiting for BLESPP"
                  );

                  ESP_LOGI(
                    "solarflow",
                    "============================================"
                  );

              - esp32_ble_tracker.stop_scan:

            else:
              - lambda: |-
                  ESP_LOGW(
                    "solarflow",
                    "Unexpected BLE connection in mode %d -> disconnecting",
                    id(solarflow_ble_mode)
                  );

              - ble_client.disconnect: solarflow_ble


    on_disconnect:
      then:

        - script.stop: solarflow_keepalive_loop


        - lambda: |-
            id(solarflow_ble_is_connected) = false;

            id(solarflow_handshake_done) = false;
            id(solarflow_getinfo_sent) = false;
            id(solarflow_getall_sent) = false;

            id(solarflow_protocol_ready) = false;
            id(solarflow_ready) = false;

            id(solarflow_smartmode_write_pending) = false;
            id(solarflow_keepalive_waiting_reply) = false;

            if (
              !id(solarflow_mode_change_active)
              &&
              id(solarflow_ble_mode) == 1
            ) {
              id(solarflow_disconnect_count)++;
            }

            id(sf_ble_connected).publish_state(false);
            id(sf_ble_ready).publish_state(false);
            id(sf_smart_mode_ok).publish_state(false);

            id(sf_disconnect_count).publish_state(
              id(solarflow_disconnect_count)
            );

            ESP_LOGW(
              "solarflow",
              "============================================"
            );

            ESP_LOGW(
              "solarflow",
              "BLE DISCONNECTED"
            );

            ESP_LOGW(
              "solarflow",
              "Mode=%d ModeChange=%s Disconnects=%d",
              id(solarflow_ble_mode),
              id(solarflow_mode_change_active) ? "YES" : "NO",
              id(solarflow_disconnect_count)
            );

            ESP_LOGW(
              "solarflow",
              "Keepalive loop stopped"
            );

            ESP_LOGW(
              "solarflow",
              "============================================"
            );


        - delay: 2s


        - if:
            condition:
              lambda: |-
                return (
                  !id(solarflow_mode_change_active)
                  &&
                  id(solarflow_ble_mode) == 1
                  &&
                  id(solarflow_selected_mac) != 0
                );

            then:
              - if:
                  condition:
                    not:
                      ble.enabled:

                  then:
                    - ble.enable:

                    - wait_until:
                        condition:
                          ble.enabled:
                        timeout: 10s

              - if:
                  condition:
                    ble.enabled:

                  then:
                    - lambda: |-
                        const uint64_t mac =
                          id(solarflow_selected_mac);

                        const auto addr_type =
                          static_cast<esp_ble_addr_type_t>(
                            id(solarflow_selected_addr_type)
                          );

                        id(solarflow_ble).set_auto_connect(false);
                        id(solarflow_ble).set_address(mac);
                        id(solarflow_ble).set_remote_addr_type(
                          addr_type
                        );
                        id(solarflow_ble).set_auto_connect(true);

                        ESP_LOGI(
                          "solarflow",
                          "Reconnect prepared -> MAC=%s",
                          id(solarflow_ble).address_str()
                        );

                    - esp32_ble_tracker.start_scan:
                        continuous: true


        - if:
            condition:
              lambda: |-
                return (
                  !id(solarflow_mode_change_active)
                  &&
                  id(solarflow_ble_mode) == 2
                );

            then:
              - if:
                  condition:
                    not:
                      ble.enabled:

                  then:
                    - ble.enable:

                    - wait_until:
                        condition:
                          ble.enabled:
                        timeout: 10s

              - if:
                  condition:
                    ble.enabled:

                  then:
                    - esp32_ble_tracker.start_scan:
                        continuous: true


number:


  - platform: template

    id: sf_input_limit

    name: "SolarFlow Input Limit"

    icon: "mdi:battery-arrow-down"

    unit_of_measurement: "W"

    min_value: 0
    max_value: 2400
    step: 1

    optimistic: false


    set_action:

      - lambda: |-

          int value = (int) x;

          if (value < 0) {
            value = 0;
          }

          if (value > 2400) {
            value = 2400;
          }

          id(cmd_input_limit) = value;


      - if:

          condition:

            lambda: |-

              return id(solarflow_ready);


          then:

